<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF  -8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de venta</title>
    <link rel="stylesheet" href="estilos.css">
</head>
            
<body>  
    
    <h1> Comprobantes <br> de venta</h1>
    <img src="img/Dsk.png" alt= "Dulces Sueños Kids">
    <br>

    <div class="pan_fecha_hoy"> 
        <label> Fecha: <br></label> 
        <input type="date" 
               name="fecha"
               id="fecha">
        <br><br>
    </div>

    <div class="pan_nombre_cliente">
        <label> Nombre del cliente: <br></label>
        <input type="text" 
               name="nombre" 
               autocapitalize="characters"
               pattern="[A-Z]"
               id="nombre">
        <br><br>
    </div>

    <div class="pan_numero_cel">
        <label> Teléfono: <br></label>
        <input type="tel" 
               name="telefono"
               pattern="[0-9]"
               maxlength="9"
               id="telefono">
        <br><br>
    </div>

    <div class="pan_producto">
        <label> Producto: <br></label>
        <input list="productos" name="productos" id="producto">
        <datalist id="productos">
            <option value="Cama"></option>
            <option value="Cama casita"></option>
            <option value="Cama casita frontal"></option>
            <option value="Cama Tee Pee"></option>
            <option value="Ropero"></option>
            <option value="Escritorio"></option>
            <option value="Librero"></option>
            <option value="Repisa"></option>
            <option value="Mesa de noche"></option>
        </datalist>
        <br><br>
    </div>

    <div class="pan_descripcion">
        <label> Descripción: <br></label>
        <textarea 
            name="descripcion" 
            id="descrip"
            placeholder="Ingrese la descripción del producto..."
            rows="7"
            cols="35">
        </textarea>
        <br><br>
    </div>
    
    <div class="pan_fecha_entrega">
        <label> Fecha de entrega: <br></label>
        <input type="date" name="fecha_ent" id="fecha_ent">
        <br><br>
    </div>

    <div class="pan_precio">
        <label> Precio total: <br></label>
        <input type="number"
               name="precio"
               id="precio"
               value="0"
               step="50">
        <br><br>
    </div>

    <div class="pan_Adelanto">
        <label> Adelanto: <br></label>
        <input type="number"
               name="adelanto"
               id="adelanto"
               value="0"
               step="50">
        <br><br>
    </div>

    <div class="pan_form_pago">
        <label> Forma de pago: <br></label>
        <input type="text"
               name="forma_pago"
               id="forma_pago">
        <br><br>
    </div>

    <button name "button">Nuevo</button>
</body> 

</html>
