<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF  -8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de venta</title>
    <link rel="stylesheet" href="estilos.css">
</head>
            
<body>  
    
    <h1> Comprobantes <br> de venta</h1>
    <img src="img/Dsk.png" alt= "Dulces Sueños Kids">
    <br>

    <div class="pan_fecha_hoy"> 
        <label for="fecha"> Fecha: <br></label> 
        <input type="date" 
               name="fecha"
               class="fecha">
        <br><br>
    </div>

    <div class="pan_nombre_cliente">
        <label for="nombre"> Nombre del cliente: <br></label>
        <input type="text" 
               name="nombre" 
               class="nombre"
               placeholder="Ingrese el nombre del cliente"
               autocapitalize="characters"
               pattern="[A-Z][0-9]">
        <br><br>
    </div>

    <div class="pan_numero_cel">
        <label for="telefono"> Teléfono: <br></label>
        <input type="tel" 
               name="telefono"
               class="telefono"
               placeholder="Ingrese el número de teléfono del cliente"
               pattern="[0-9]"
               maxlength="9">
        <br><br>
    </div>

    <div class="pan_producto">
        <label for="producto"> Producto: <br></label>
        <input list="productos" 
               name="productos"
               class="producto"
               placeholder="Seleccione un producto de la lista"
               autocapitalize="characters">
        <datalist id="productos">
            <option value="Cama"></option>
            <option value="Cama casita"></option>
            <option value="Cama casita frontal"></option>
            <option value="Cama Tee Pee"></option>
            <option value="Ropero"></option>
            <option value="Escritorio"></option>
            <option value="Librero"></option>
            <option value="Repisa"></option>
            <option value="Mesa de noche"></option>
        </datalist>
        <br><br>
    </div>

    <div class="pan_descripcion">
        <label for="descrip"> Descripción: <br></label>
        <textarea
            name="descrip" 
            class="descrip"
            placeholder="Ingrese la descripción del producto..."
            autocapitalize="characters"
            rows="7"
            cols="35">
        </textarea>
        <br><br>
    </div>
    
    <div class="pan_fecha_entrega">
        <label for="fecha_ent"> Fecha de entrega: <br></label>
        <input type="date" 
               name="fecha_ent"
               class="fecha_ent">
        <br><br>
    </div>

    <div class="pan_precio">
        <label for="precio"> Precio total: <br></label>
        <input type="number"
               name="precio"
               class="precio"
               step="50">
        <br><br>
    </div>

    <div class="pan_Adelanto">
        <label for="adelanto"> Adelanto: <br></label>
        <input type="number"
               name="adelanto"
               class="adelanto"
               step="50">
        <br><br>
    </div>

    <div class="pan_form_pago">
        <label for="forma_pago"> Forma de pago: <br></label>
        <input list="forma_pago"
               name="forma_pago"
               class="forma_pago">
        <datalist id="forma_pago">
            <option value="Yape"></option>
            <option value="Plin"></option>
            <option value="Transferencia"></option>
            <option value="Efectivo"></option>
        </datalist>
        </datalist>

         <br><br>
    </div>

    <button name "button">Nuevo</button>
</body> 

</html>
